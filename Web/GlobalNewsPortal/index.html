<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global News Portal | Motor de Busca</title>
    <meta name="description" content="O maior motor de busca global de notícias 100% em Português.">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav>
        <div class="logo">
            <svg width="24" height="24" fill="none" stroke="url(#grad)" stroke-width="2" viewBox="0 0 24 24">
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#60a5fa" />
                        <stop offset="100%" stop-color="#c084fc" />
                    </linearGradient>
                </defs>
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
            </svg>
            GlobalNews<span>Portal</span>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>O Mundo em <span>Português</span></h1>
            <p class="subtitle">Pesquise qualquer notícia, artigo ou novidade na web. O nosso motor de inteligência artificial traduz tudo para você em tempo real.</p>
        </header>

        <div class="search-wrapper">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Pesquisar qualquer assunto (Ex: Solana, Inteligência Artificial...)">
                <button class="btn-search" onclick="handleSearch()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    Buscar
                </button>
            </div>
        </div>

        <nav class="categories" id="categories-container" aria-label="Filtro de Categorias">
            <button class="cat-btn active" id="btn-all" onclick="loadNews(null, this)">Últimas Notícias</button>
            <button class="cat-btn" onclick="loadNews('Criptomoedas', this)">Criptomoedas</button>
            <button class="cat-btn" onclick="loadNews('Negócios', this)">Negócios</button>
            <button class="cat-btn" onclick="loadNews('Inteligência Artificial', this)">IA &amp; Tech</button>
            <button class="cat-btn" onclick="loadNews('Global', this)">Mundo</button>
            <button class="cat-btn" onclick="loadNews('África', this)">África &amp; Angola</button>
        </nav>

        <main id="news-container" class="news-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Sincronizando com o motor de inteligência...</p>
            </div>
        </main>
    </div>

    <!-- Modal for reading full article -->
    <div class="modal-overlay" id="readerModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Lendo Artigo...</h3>
                <button class="close-btn" onclick="closeModal()" aria-label="Fechar modal">&times;</button>
            </div>
            <div class="article-body" id="articleBody">
                <div style="text-align: center; padding: 50px;">
                    <div class="spinner"></div>
                    <p style="font-family: 'Inter', sans-serif; color: var(--text-muted);">Iniciando o modo leitura premium...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
