<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global News Portal - Admin Seguro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #e9ecef; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #0d3b66; border-bottom: 2px solid #e63946; padding-bottom: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
        input[type="text"], input[type="password"], select, textarea, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 1rem; }
        input[type="file"] { padding: 8px; background: #f8f9fa; cursor: pointer; }
        textarea { height: 150px; resize: vertical; }
        .btn { background: #0d3b66; color: #fff; border: none; padding: 12px 25px; font-size: 1.1rem; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; transition: background 0.3s; }
        .btn:hover { background: #e63946; }
        .help-text { font-size: 0.85rem; color: #666; margin-top: 5px; }
        #message { margin-top: 20px; font-weight: bold; text-align: center; font-size: 1.1rem; padding: 10px; border-radius: 4px; }
        .lock-icon { font-size: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="lock-icon">🔒</span> Portal Admin Seguro</h1>
        <form id="postForm">
            <div class="form-group">
                <label>Chave de Acesso (X-API-KEY)</label>
                <input type="password" id="apiKey" required placeholder="Digite a chave mestre secreta...">
            </div>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">
            <div class="form-group">
                <label>Título da Notícia</label>
                <input type="text" id="title" required placeholder="Ex: Novo Acordo Comercial Firmado">
            </div>
            <div class="form-group">
                <label>Categoria</label>
                <select id="category">
                    <option value="Global">Mundo</option>
                    <option value="África">África & Angola</option>
                    <option value="Inteligência Artificial">Tecnologia & IA</option>
                    <option value="Negócios">Negócios</option>
                    <option value="Criptomoedas">Criptomoedas</option>
                </select>
            </div>
            <div class="form-group">
                <label>Imagem de Capa (Upload)</label>
                <input type="file" id="image_file" accept="image/*">
                <div class="help-text">Ou cole o link de uma imagem abaixo se não quiser fazer upload:</div>
                <input type="text" id="image_url" placeholder="https://exemplo.com/imagem.jpg" style="margin-top: 5px;">
            </div>
            <div class="form-group">
                <label>Resumo (Manchete)</label>
                <textarea id="summary" required placeholder="Um breve resumo em 2-3 linhas..."></textarea>
            </div>
            <div class="form-group">
                <label>Conteúdo Completo da Matéria</label>
                <textarea id="content" required placeholder="Escreva o texto completo da notícia aqui... (Suporta HTML)"></textarea>
            </div>
            <button type="submit" class="btn">Publicar Notícia Oficial</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const msg = document.getElementById('message');
            btn.disabled = true;
            btn.innerText = "Enviando de forma segura...";
            msg.innerHTML = "";
            msg.style.background = "transparent";

            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('image_url', document.getElementById('image_url').value);
            formData.append('summary', document.getElementById('summary').value);
            formData.append('content', document.getElementById('content').value);
            
            const fileInput = document.getElementById('image_file');
            if(fileInput.files.length > 0) {
                formData.append('image_file', fileInput.files[0]);
            }

            try {
                const response = await fetch('/api/admin/post', {
                    method: 'POST',
                    headers: {
                        'X-API-KEY': document.getElementById('apiKey').value
                    },
                    body: formData
                });
                
                const data = await response.json();
                if (data.status === 'success') {
                    msg.style.color = '#155724';
                    msg.style.background = '#d4edda';
                    msg.innerText = "✅ Notícia publicada com sucesso! Ela já está visível na capa.";
                    e.target.reset(); // Limpa form
                } else {
                    msg.style.color = '#721c24';
                    msg.style.background = '#f8d7da';
                    msg.innerText = "❌ Erro: " + data.message;
                }
            } catch (error) {
                msg.style.color = '#721c24';
                msg.style.background = '#f8d7da';
                msg.innerText = "❌ Erro de conexão com o servidor.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Publicar Notícia Oficial";
            }
        });
    </script>
</body>
</html>
